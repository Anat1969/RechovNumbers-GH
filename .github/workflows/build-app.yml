name: build-app
# בונה את app/ לקישור הישיר מ-GitHub (raw.githack), בלי לשרוף פריסות Vercel.
on:
  push:
    branches: [main]
    paths-ignore: ['app/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/fetch-snapshot.mjs
      - run: npm run build:github
      - name: commit app/ if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git diff --cached --quiet || (git commit -m "app: בנייה לקישור הישיר" && git pull --rebase && git push)
